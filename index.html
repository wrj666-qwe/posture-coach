<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体态与训练工具</title>
<style>
:root{--bg:#f5f3ee;--ink:#18261f;--muted:#71847d;--teal:#0f6b5f;--hot:#b2452f;--line:#e5e1d6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:24px}
.card{max-width:560px;width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:0 10px 30px rgba(23,37,31,.06)}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.4px}
p{color:var(--muted);font-size:14px;margin:0 0 20px}
a{display:block;text-decoration:none;border-radius:12px;padding:14px 16px;margin-bottom:10px;font-weight:600;font-size:15px}
a.primary{background:var(--teal);color:#fff}
a.ghost{background:#fff;border:1px solid var(--line);color:var(--teal)}
a span{display:block;font-weight:400;font-size:12px;margin-top:2px;opacity:.75}
.foot{font-size:11.5px;color:var(--muted);margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <h1>体态与训练工具</h1>
  <p>选条件 → 出计划 → 打卡 → 调整。数据只存本地，不上传。</p>

  <a class="primary" href="product/">小白健身计划生成器
    <span>选 3 个条件，生成一周计划，每个动作配视频</span></a>
  <a class="ghost" href="product/pricing.html">价格与购买
    <span>体验 1.9 / 月卡 9.9 / 季卡 29.9</span></a>

  <div class="foot">
    ⚠ 本工具提供训练参考，不替代现场指导与医疗建议。持续疼痛、麻木、脊柱损伤、术后、孕期请先咨询医生/康复师。<br>
    训练中出现胸闷、头晕、关节刺痛请立即停止。
  </div>
</div>
</body>
</html>
