<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:800px;height:800px;background:#f5f3ee;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#18261f;overflow:hidden;position:relative}
.wrap{padding:64px 56px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.tag{display:inline-block;background:#0f6b5f;color:#fff;font-size:20px;padding:8px 18px;border-radius:999px;letter-spacing:1px}
h1{font-size:76px;line-height:1.18;margin-top:34px;letter-spacing:-2px}
h1 em{font-style:normal;color:#b2452f}
.sub{font-size:26px;color:#5c6f68;margin-top:22px;line-height:1.6}
.box{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.box span{border:2px solid #d6d1c2;background:#fff;border-radius:12px;padding:12px 20px;font-size:22px;color:#3d5049}
.foot{display:flex;justify-content:space-between;align-items:flex-end}
.price{font-size:88px;font-weight:800;color:#b2452f;line-height:1}
.price small{font-size:24px;font-weight:400;color:#71847d;margin-left:6px}
.note{font-size:18px;color:#71847d;text-align:right;line-height:1.5}
.badge{position:absolute;top:0;right:0;background:#b2452f;color:#fff;font-size:19px;padding:12px 26px;border-bottom-left-radius:18px}
</style>
</head>
<body>
<div class="badge">当天发货 · 电子交付</div>
<div class="wrap">
  <div>
    <span class="tag">健身小白专用</span>
    <h1>选 3 个条件<br>给你一周<em>能照着做</em>的计划</h1>
    <p class="sub">不用记动作 · 不用查视频 · 不用想组数</p>
    <div class="box"><span>徒手</span><span>哑铃</span><span>健身房</span></div>
  </div>
  <div class="foot">
    <div class="price">9.9<small>元起</small></div>
    <div class="note">含动作视频 · 组数次数<br>练完告诉你下周加量还是减量</div>
  </div>
</div>
</body>
</html>
